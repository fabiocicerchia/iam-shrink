site_name: iam-shrink
site_description: CloudTrail usage to minimized IAM policies as Terraform diffs.
repo_url: https://github.com/fabiocicerchia/iam-shrink
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
