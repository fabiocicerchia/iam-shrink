[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-shrink"
version = "0.2.2"
description = "CloudTrail usage to minimized IAM policies as Terraform diffs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/iam-shrink"
Issues = "https://github.com/fabiocicerchia/iam-shrink/issues"
Changelog = "https://github.com/fabiocicerchia/iam-shrink/blob/main/CHANGELOG.md"

[project.scripts]
iam-shrink = "iam_shrink:main"

[tool.setuptools]
py-modules = ["iam_shrink"]

[tool.pytest.ini_options]
# Put the checkout ahead of site-packages: without this `pytest -q` from a
# clean clone imports an installed iam_shrink instead of the one being edited.
pythonpath = ["."]

[tool.ruff]
line-length = 100
