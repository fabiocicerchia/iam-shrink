[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-shrink"
version = "0.2.1"
description = "CloudTrail usage to minimized IAM policies as Terraform diffs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/iam-shrink"
Issues = "https://github.com/fabiocicerchia/iam-shrink/issues"
Changelog = "https://github.com/fabiocicerchia/iam-shrink/blob/main/CHANGELOG.md"

[project.scripts]
iam-shrink = "iam_shrink:main"

[tool.setuptools]
py-modules = ["iam_shrink"]

[tool.pytest.ini_options]
# Put the checkout ahead of site-packages: without this `pytest -q` from a
# clean clone imports an installed iam_shrink instead of the one being edited.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
  "ANN202",   # ditto for a fake's return value
  "N803",     # the boto3 fakes mirror AWS's own PascalCase parameter names.
              # Those are the API's spelling, not this project's to change:
              # renaming them would stop the fakes matching the real calls.
  "A002",     # `filter` is Access Analyzer's parameter name, same reason
  "PTH110",   # os.path in a test that is checking os.path behaviour
]
